services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      # Override with a real secret via a root .env file or shell env if you
      # want one; otherwise config.py's own documented dev-only fallback
      # applies (safe — it's rejected outright when APP_ENV=production).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      DATABASE_URL: sqlite:////app/data/biostock.db
    volumes:
      # Persist the SQLite DB across container restarts/rebuilds.
      - biostock-data:/app/data
    restart: unless-stopped

volumes:
  biostock-data:
